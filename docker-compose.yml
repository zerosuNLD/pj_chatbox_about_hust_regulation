# =============================================================================
# HUST Q&A — Docker Compose
#
# Usage:
#   1. cp backend/.env.example backend/.env
#   2. Edit backend/.env (fill in GROQ_API_KEY, DEEPSEEK_API_KEY)
#   3. docker compose up --build
#
# Services:
#   backend  → http://localhost:8000  (FastAPI + LangGraph + GraphRAG)
#   frontend → http://localhost:3000  (Next.js chat interface)
# =============================================================================

services:
  # ── Backend: FastAPI + LangGraph + GraphRAG ──────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hust-qa-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Persist FAISS naive index across container restarts
      # (built on first startup, ~30-60s — subsequent starts are instant)
      - naive_index_cache:/app/output/naive_index
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s  # allow time for FAISS index build on first run

  # ── Frontend: Next.js Chat Interface ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Backend URL as seen from the USER'S BROWSER (not inside Docker network)
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: hust-qa-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# ── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  naive_index_cache:
    # FAISS index is stored here so it persists across `docker compose restart`
    # To force rebuild: docker compose down -v && docker compose up
